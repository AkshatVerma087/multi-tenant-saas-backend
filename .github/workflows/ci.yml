name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: app_password
          POSTGRES_DB: my_saas_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Migrations
      run: npm run migrate:up
      env:
        DATABASE_URL: postgresql://app_user:app_password@localhost:5432/my_saas_api

    - name: Run Tests
      run: npm test
      env:
        DATABASE_URL: postgresql://app_user:app_password@localhost:5432/my_saas_api
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test_secret_string_for_ci
